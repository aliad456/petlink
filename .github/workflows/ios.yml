# Builds the iPhone app (ios/). No Mac needed: it runs on GitHub's macOS machines.
# - On every push to ios/: builds for the simulator, unsigned, to check the code compiles.
# - Run workflow (GitHub → Actions → "iOS app"): when the Apple secrets exist, also signs
#   the app and uploads it to App Store Connect (TestFlight). Secrets (never in the code):
#     APPLE_TEAM_ID, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8
#     IOS_FCM_APP_ID, IOS_FCM_API_KEY (Firebase iOS app) + KAMI_FCM_PROJECT_ID, KAMI_FCM_SENDER_ID
# See docs/IOS.md.
name: iOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store"
        required: true
        default: "1.0"
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MARKETING_VERSION: ${{ github.event.inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Kami.xcodeproj -scheme Kami -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit "${PIPESTATUS[0]}"

      - name: Archive and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && env.APPLE_TEAM_ID != ''
        working-directory: ios
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          FCM_APP_ID: ${{ secrets.IOS_FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.IOS_FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.KAMI_FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.KAMI_FCM_SENDER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          xcodebuild -project Kami.xcodeproj -scheme Kami -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Kami.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            KAMI_FCM_APP_ID="$FCM_APP_ID" KAMI_FCM_API_KEY="$FCM_API_KEY" \
            KAMI_FCM_PROJECT_ID="$FCM_PROJECT_ID" KAMI_FCM_SENDER_ID="$FCM_SENDER_ID" \
            archive | tail -n 40
          test "${PIPESTATUS[0]}" = 0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kami.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice::Uploaded build $BUILD_NUMBER (version $MARKETING_VERSION). It shows up in App Store Connect → TestFlight in a few minutes."
